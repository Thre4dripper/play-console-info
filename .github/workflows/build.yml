name: Build & Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

# Standalone runs (push/PR/dispatch): cancel any in-flight run for the same
# branch so only the latest commit's changes land.
# Reusable calls (workflow_call): each caller gets a unique group keyed by the
# caller's run_id, so callers never cancel each other and never race with a
# simultaneous standalone push run.
concurrency:
  group: ${{ github.event_name == 'workflow_call' && format('build-call-{0}', github.run_id) || format('build-push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: write

jobs:
  # ─── Job 1: Format code (parallel) ────────────────────────────────────────
  # Runs format:fix, detects what changed, and exposes it as an output so the
  # commit job can write a meaningful message. Skipped on workflow_call —
  # callers only need the dist artifact.
  format:
    name: Format Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_call'
    outputs:
      changed: ${{ steps.fmt.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Formatter
        run: pnpm format:fix

      - name: Detect format changes
        id: fmt
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Files reformatted:"
            git diff --name-only
          fi

      - name: Save format patch
        if: steps.fmt.outputs.changed == 'true'
        run: git diff > format.patch

      - name: Upload format patch
        if: steps.fmt.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: format.patch
          retention-days: 1

  # ─── Job 2: Build dist/index.js (always — artifact forwarded to callers) ──
  build:
    name: Build dist/index.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-bundle
          path: dist/index.js
          retention-days: 1
          if-no-files-found: error
          overwrite: true   # same commit → identical output

  # ─── Job 3: Single atomic commit for format + dist changes ────────────────
  # Waits for both parallel jobs. Re-applies format (idempotent) and pulls the
  # built dist artifact, then makes exactly one commit covering both changes.
  # Skipped on workflow_call — callers should never push to the repo.
  # Skipped on pull_request — bots don't push to PR branches.
  commit:
    name: Commit changes
    needs: [format, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_call' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download format patch
        if: needs.format.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: format-patch
          path: /tmp/format-patch

      - name: Apply format patch
        if: needs.format.outputs.changed == 'true'
        run: git apply /tmp/format-patch/format.patch

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-bundle
          path: dist

      - name: Check for any changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit — skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Build commit message
        if: steps.diff.outputs.changed == 'true'
        id: msg
        run: |
          FMT="${{ needs.format.outputs.changed }}"
          DIST_DIFF=$(git diff --name-only | grep -c 'dist/index.js' || true)
          if [ "$FMT" = "true" ] && [ "$DIST_DIFF" -gt 0 ]; then
            echo "message=chore: format + rebuild dist [skip ci]" >> "$GITHUB_OUTPUT"
          elif [ "$FMT" = "true" ]; then
            echo "message=chore: format code [skip ci]" >> "$GITHUB_OUTPUT"
          else
            echo "message=chore: rebuild dist [skip ci]" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ steps.msg.outputs.message }}"
          git push

