name: Release
on:
#  push:
#    branches:
#      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    uses: thre4dripper/Reusable-Atomic-Workflows/.github/workflows/test-unit.yml@main
    with:
      package-manager: pnpm
      test-command: pnpm test:unit
      coverage-command: pnpm run test:unit:coverage

  lint-check:
    name: Lint Check
    uses: thre4dripper/Reusable-Atomic-Workflows/.github/workflows/quality-lint.yml@main
    with:
      package-manager: pnpm
      lint-check-command: pnpm link:check

  type-check:
    name: Type Check
    uses: thre4dripper/Reusable-Atomic-Workflows/.github/workflows/quality-typecheck.yml@main
    with:
      package-manager: pnpm

  test-play-console-cli:
    name: Test Play Console CLI
    needs: [type-check, lint-check, unit-tests]
    uses: ./.github/workflows/play-console-info.yml
    secrets: inherit

  build-mock-binaries:
    name: Build Mock CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [type-check, lint-check, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
            artifact-path: bin/mock/linux/mockCli-linux-x64
          - platform: linux
            arch: arm64
            os: ubuntu-latest          # Bun cross-compiles — no arm64 runner needed
            artifact-path: bin/mock/linux/mockCli-linux-arm64
          - platform: mac
            arch: x64
            os: macos-13              # last Intel macOS runner
            artifact-path: bin/mock/mac/mockCli-mac-x64
          - platform: mac
            arch: arm64
            os: macos-latest          # Apple Silicon runner
            artifact-path: bin/mock/mac/mockCli-mac-arm64
          - platform: windows
            arch: x64
            os: windows-latest
            artifact-path: bin/mock/windows/mockCli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build binary (Unix)
        if: matrix.platform != 'windows'
        run: bash cli/mock/build-mock-cli-${{ matrix.platform }}.sh ${{ matrix.arch }}

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: cli\mock\build-mock-cli-windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-path }}

  build-python-binaries:
    name: Build Python CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [type-check, lint-check, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
            artifact-path: bin/python/linux/play_console_cli-linux-x64
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm       # native arm64 Linux runner
            artifact-path: bin/python/linux/play_console_cli-linux-arm64
          - platform: mac
            arch: x64
            os: macos-13              # last Intel macOS runner
            artifact-path: bin/python/mac/play_console_cli-mac-x64
          - platform: mac
            arch: arm64
            os: macos-latest          # Apple Silicon runner
            artifact-path: bin/python/mac/play_console_cli-mac-arm64
          - platform: windows
            arch: x64
            os: windows-latest
            artifact-path: bin/python/windows/play_console_cli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build binary (Unix)
        if: matrix.platform != 'windows'
        run: bash cli/python/build-cli-${{ matrix.platform }}.sh

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: cli\python\build-cli-windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-path }}

  create-release:
    name: Create Release
    needs: [test-play-console-cli, build-mock-binaries, build-python-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
