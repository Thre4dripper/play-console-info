name: Release
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if version tag already exists
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists — release will be skipped."
            exit 1
          else
            echo "Version v$VERSION is new — release will proceed."
          fi

  unit-tests:
    name: Unit Tests
    needs: version-guard
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  lint-check:
    name: Lint Check
    needs: version-guard
    uses: thre4dripper/Reusable-Atomic-Workflows/.github/workflows/quality-lint.yml@main
    with:
      package-manager: pnpm
      lint-check-command: pnpm link:check

  type-check:
    name: Type Check
    uses: thre4dripper/Reusable-Atomic-Workflows/.github/workflows/quality-typecheck.yml@main
    needs: version-guard
    with:
      package-manager: pnpm

  test-play-console-cli:
    name: Test Play Console CLI
    needs: [type-check, lint-check, unit-tests]
    uses: ./.github/workflows/play-console-info.yml
    secrets: inherit

  build-mock-binaries:
    name: Build Mock CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [type-check, lint-check, unit-tests]
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
            artifact-path: bin/mock/linux/mockCli-linux-x64
          - platform: linux
            arch: arm64
            os: ubuntu-latest # Bun cross-compiles — no arm64 runner needed
            artifact-path: bin/mock/linux/mockCli-linux-arm64
          - platform: mac
            arch: arm64
            os: macos-latest
            artifact-path: bin/mock/mac/mockCli-mac-arm64
          - platform: windows
            arch: x64
            os: windows-latest
            artifact-path: bin/mock/windows/mockCli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build binary (Unix)
        if: matrix.platform != 'windows'
        run: bash cli/mock/build-mock-cli-${{ matrix.platform }}.sh ${{ matrix.arch }}

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: cli\mock\build-mock-cli-windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mock-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  build-python-binaries:
    name: Build Python CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [type-check, lint-check, unit-tests]
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
            artifact-path: bin/python/linux/play_console_cli-linux-x64
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm # native arm64 Linux runner
            artifact-path: bin/python/linux/play_console_cli-linux-arm64
          - platform: mac
            arch: arm64
            os: macos-latest
            artifact-path: bin/python/mac/play_console_cli-mac-arm64
          - platform: windows
            arch: x64
            os: windows-latest
            artifact-path: bin/python/windows/play_console_cli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: cli/python/.venv-${{ matrix.platform }}-${{ matrix.arch }}
          key: venv-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('cli/python/requirements.txt') }}

      - name: Build binary (Unix)
        if: matrix.platform != 'windows'
        run: bash cli/python/build-cli-${{ matrix.platform }}.sh ${{ matrix.arch }}

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: cli\python\build-cli-windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  create-release:
    name: Create Release
    needs: [test-play-console-cli, build-mock-binaries, build-python-binaries]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python binary artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: python-*
          merge-multiple: true

      - name: Get version and changelog
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" 2>/dev/null)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" 2>/dev/null)
          fi

          if [ -n "$COMMITS" ]; then
            BODY="## 🔨 Changes"$'\n'"$COMMITS"
          else
            BODY=""
          fi

          {
            echo "BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.version.outputs.BODY }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*

      - name: Update floating major version tag
        run: |
          MAJOR=$(echo "${{ steps.version.outputs.VERSION }}" | cut -d. -f1)
          git tag -f "v${MAJOR}" "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${MAJOR}" --force

  update-readme:
    name: Update README Download Links
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update download links in README
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Update versioned download links
          sed -i "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/|releases/download/v${VERSION}/|g" README.md
          # Update static release badge
          sed -i "s|release-v[0-9]*\.[0-9]*\.[0-9]*-3DDC84|release-v${VERSION}-3DDC84|g" README.md
          echo "Updated README to v${VERSION}"

      - name: Commit updated README
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README download links to v${VERSION} [skip ci]"
          git push
