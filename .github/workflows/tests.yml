name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli/mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'jest.config.ts'
      - '.c8rc.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli/mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'jest.config.ts'
      - '.c8rc.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # ─── Job 0: Build Dist ───────────────────────────────────────────────────
  # Validates that dist/index.js can be compiled and exposes it as an artifact
  # for any downstream consumer. The format + commit steps inside build.yml
  # are skipped because we are calling it as a reusable workflow (workflow_call).
  build-dist:
    name: Build & Format
    uses: ./.github/workflows/build.yml

  # ─── Job 1: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

  # ─── Job 2: Build Mock CLI binary (linux x64, used by mock + coverage) ───
  build-mock-cli:
    name: Build Mock CLI (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Mock CLI binary
        run: bash cli/mock/build-mock-cli-linux.sh x64

      - name: Upload Mock CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: mock-cli-linux-x64
          path: bin/mock/linux/mockCli-linux-x64
          retention-days: 1
          if-no-files-found: error

  # ─── Job 3: Mock CLI Tests ────────────────────────────────────────────────
  mock-cli-tests:
    name: Mock CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-mock-cli

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Mock CLI binary
        uses: actions/download-artifact@v7
        with:
          name: mock-cli-linux-x64
          path: bin/mock/linux

      - name: Make Mock CLI Executable
        run: chmod +x bin/mock/linux/mockCli-linux-x64

      - name: Run Mock CLI Tests
        run: pnpm run test:mock

  # ─── Job 4: Coverage Report (c8) ─────────────────────────────────────────
  coverage:
    name: Coverage Report (c8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - unit-tests
      - mock-cli-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Mock CLI binary
        uses: actions/download-artifact@v7
        with:
          name: mock-cli-linux-x64
          path: bin/mock/linux

      - name: Make Mock CLI Executable
        run: chmod +x bin/mock/linux/mockCli-linux-x64

      - name: Run Tests with c8 Coverage
        run: pnpm run test:coverage

      - name: Generate HTML Coverage Report
        run: pnpm exec c8 report --reporter=html --reporter=lcov --reporter=json-summary

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Upload lcov to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn
