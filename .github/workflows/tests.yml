name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli/mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'jest.config.ts'
      - '.c8rc.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli/mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'jest.config.ts'
      - '.c8rc.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Job 1: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

  # ─── Job 2: Mock CLI Tests ────────────────────────────────────────────────
  mock-cli-tests:
    name: Mock CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Mock CLI Executable
        run: chmod +x bin/mock/linux/mockCli-linux bin/python/linux/play_console_cli-linux

      - name: Run Mock CLI Tests
        run: pnpm run test:mock

  # ─── Job 3: Coverage Report (c8) ─────────────────────────────────────────
  coverage:
    name: Coverage Report (c8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - unit-tests
      - mock-cli-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Mock CLI Executable
        run: chmod +x bin/mock/linux/mockCli-linux bin/python/linux/play_console_cli-linux

      - name: Run Tests with c8 Coverage
        run: pnpm run test:coverage

      - name: Generate HTML Coverage Report
        run: pnpm exec c8 report --reporter=html --reporter=lcov --reporter=json-summary

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Upload lcov to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn
