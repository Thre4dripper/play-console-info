name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli/mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'jest.config.ts'
      - '.c8rc.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli/mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'jest.config.ts'
      - '.c8rc.json'
  workflow_dispatch:
  workflow_call:

# Standalone runs (push/PR/dispatch): cancel older in-flight runs for the same
# branch so only the latest commit is tested.
# Reusable calls (workflow_call): each caller gets a unique group keyed by
# run_id so they never cancel each other or race with a standalone run.
concurrency:
  group: ${{ github.event_name == 'workflow_call' && format('tests-call-{0}', github.run_id) || format('tests-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:

  # ─── Job 1: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

  # ─── Job 2: Mock CLI Tests ────────────────────────────────────────────────
  # setup-mock-cli (singleton action) handles build-or-download automatically.
  mock-cli-tests:
    name: Mock CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Mock CLI
        uses: ./.github/actions/setup-mock-cli
        with:
          platform: 'linux'
          arch: 'x64'

      - name: Run Mock CLI Tests
        run: pnpm run test:mock

  # ─── Job 3: Coverage Report (c8) ─────────────────────────────────────────
  coverage:
    name: Coverage Report (c8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - unit-tests
      - mock-cli-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Mock CLI
        uses: ./.github/actions/setup-mock-cli
        with:
          platform: 'linux'
          arch: 'x64'

      - name: Run Tests with c8 Coverage
        run: pnpm run test:coverage

      - name: Generate HTML Coverage Report
        run: pnpm exec c8 report --reporter=html --reporter=lcov --reporter=json-summary

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Upload lcov to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn
