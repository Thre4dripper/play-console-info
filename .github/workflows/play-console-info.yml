name: Play Console Info - Full Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-basic:
    runs-on: ubuntu-latest
    name: Test Basic Functionality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test basic package info
        id: basic
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          tracks: all
          apks: true

      - name: Display basic outputs
        run: |
          echo "::group::Basic Test Results"
          echo "Tracks: ${{ steps.basic.outputs.tracks }}"
          echo "APKs: ${{ steps.basic.outputs.apks }}"
          echo "::endgroup::"

  test-all-resources:
    runs-on: ubuntu-latest
    name: Test All Resources
    needs: test-basic
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test with all resources enabled
        id: all
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          all: 'true'
          uploadOutputsArtifact: 'true'
          outputsArtifactName: 'all-resources-test'

      - name: Display all outputs
        run: |
          echo "::group::All Resources Test"
          echo "Tracks: ${{ steps.all.outputs.tracks }}" | head -c 1000
          echo "APKs: ${{ steps.all.outputs.apks }}" | head -c 1000
          echo "Bundles: ${{ steps.all.outputs.bundles }}" | head -c 1000
          echo "Listings: ${{ steps.all.outputs.listings }}" | head -c 1000
          echo "Images: ${{ steps.all.outputs.images }}" | head -c 1000
          echo "In-apps: ${{ steps.all.outputs.inapps }}" | head -c 1000
          echo "Reviews: ${{ steps.all.outputs.reviews }}" | head -c 1000
          echo "Voided Purchases: ${{ steps.all.outputs.voidedPurchases }}" | head -c 1000
          echo "Testers: ${{ steps.all.outputs.testers }}" | head -c 1000
          echo "App Details: ${{ steps.all.outputs.appDetails }}" | head -c 1000
          echo "Expansion Files: ${{ steps.all.outputs.expansionFiles }}" | head -c 1000
          echo "::endgroup::"

  test-specific-tracks:
    runs-on: ubuntu-latest
    name: Test Specific Tracks
    needs: test-all-resources
    strategy:
      max-parallel: 1
      matrix:
        tracks:
          [
            'internal',
            'alpha',
            'beta',
            'production',
            'internal,alpha',
            'beta,production',
          ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test tracks - ${{ matrix.tracks }}
        id: tracks
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          tracks: ${{ matrix.tracks }}

      - name: Display track results
        run: |
          echo "::group::Tracks Test - ${{ matrix.tracks }}"
          echo "Result: ${{ steps.tracks.outputs.tracks }}"
          echo "::endgroup::"

  test-image-options:
    runs-on: ubuntu-latest
    name: Test Image Options
    needs: test-specific-tracks
    strategy:
      max-parallel: 1
      matrix:
        images:
          ['icon', 'featureGraphic', 'phoneScreenshots', 'icon,featureGraphic']
        language: ['en-US', 'es-ES', 'fr-FR']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test images - ${{ matrix.images }} (${{ matrix.language }})
        id: images
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          images: ${{ matrix.images }}
          imagesLanguage: ${{ matrix.language }}

      - name: Display image results
        run: |
          echo "::group::Images Test - ${{ matrix.images }} (${{ matrix.language }})"
          echo "Result: ${{ steps.images.outputs.images }}" | head -c 500
          echo "::endgroup::"

  test-reviews-pagination:
    runs-on: ubuntu-latest
    name: Test Reviews Pagination
    needs: test-image-options
    strategy:
      max-parallel: 1
      matrix:
        pages: ['1', '2', '3']
        pageSize: ['50', '100', '200']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test reviews - ${{ matrix.pages }} pages, ${{ matrix.pageSize }} size
        id: reviews
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          reviews: 'true'
          reviewsPages: ${{ matrix.pages }}
          reviewsPageSize: ${{ matrix.pageSize }}

      - name: Display review results
        run: |
          echo "::group::Reviews Test - ${{ matrix.pages }} pages, ${{ matrix.pageSize }} size"
          echo "Result: ${{ steps.reviews.outputs.reviews }}" | head -c 500
          echo "::endgroup::"

  test-file-vs-plaintext:
    runs-on: ubuntu-latest
    name: Test File vs PlainText Auth
    needs: test-reviews-pagination
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Test with file path
        id: file-auth
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPath: service-account.json
          tracks: 'production'

      - name: Test with plain text
        id: plaintext-auth
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          tracks: 'production'

      - name: Compare results
        run: |
          echo "::group::Authentication Method Comparison"
          echo "File auth tracks: ${{ steps.file-auth.outputs.tracks }}"
          echo "PlainText auth tracks: ${{ steps.plaintext-auth.outputs.tracks }}"
          echo "::endgroup::"

  test-output-artifacts:
    runs-on: ubuntu-latest
    name: Test Output Artifacts
    needs: test-file-vs-plaintext
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test custom output path
        id: custom-output
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          all: 'true'
          uploadOutputsArtifact: 'true'
          outputsJsonPath: 'custom-outputs/play-console-data.json'
          outputsArtifactName: 'custom-play-console-outputs'

      - name: Verify output file
        run: |
          echo "::group::Custom Output Test"
          if [ -f "custom-outputs/play-console-data.json" ]; then
            echo "✅ Custom output file created successfully"
            echo "File size: $(stat -c%s custom-outputs/play-console-data.json) bytes"
            echo "File preview:"
            head -c 500 custom-outputs/play-console-data.json
          else
            echo "❌ Custom output file not found"
          fi
          echo "::endgroup::"

  test-individual-resources:
    runs-on: ubuntu-latest
    name: Test Individual Resources
    needs: test-output-artifacts
    strategy:
      max-parallel: 1
      matrix:
        resource:
          - { name: 'apks', value: 'true' }
          - { name: 'bundles', value: 'true' }
          - { name: 'listings', value: 'true' }
          - { name: 'inapps', value: 'true' }
          - { name: 'voidedPurchases', value: 'true' }
          - { name: 'appDetails', value: 'true' }
          - { name: 'expansionFiles', value: 'true' }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test ${{ matrix.resource.name }}
        id: resource-test
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          ${{ matrix.resource.name }}: ${{ matrix.resource.value }}

      - name: Display resource results
        run: |
          echo "::group::${{ matrix.resource.name }} Test"
          case "${{ matrix.resource.name }}" in
            "apks") echo "APKs: ${{ steps.resource-test.outputs.apks }}" ;;
            "bundles") echo "Bundles: ${{ steps.resource-test.outputs.bundles }}" ;;
            "listings") echo "Listings: ${{ steps.resource-test.outputs.listings }}" ;;
            "inapps") echo "In-apps: ${{ steps.resource-test.outputs.inapps }}" ;;
            "voidedPurchases") echo "Voided: ${{ steps.resource-test.outputs.voidedPurchases }}" ;;
            "appDetails") echo "Details: ${{ steps.resource-test.outputs.appDetails }}" ;;
            "expansionFiles") echo "Expansion: ${{ steps.resource-test.outputs.expansionFiles }}" ;;
          esac
          echo "::endgroup::"

  test-testers:
    runs-on: ubuntu-latest
    name: Test Testers
    needs: test-individual-resources
    strategy:
      max-parallel: 1
      matrix:
        testers:
          ['internal', 'alpha', 'beta', 'production', 'all', 'internal,alpha']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: chmod +x ./cli/dist/play_console_cli

      - name: Test testers - ${{ matrix.testers }}
        id: testers
        uses: ./
        with:
          package: ${{ secrets.PACKAGE_NAME }}
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          testers: ${{ matrix.testers }}

      - name: Display testers results
        run: |
          echo "::group::Testers Test - ${{ matrix.testers }}"
          echo "Result: ${{ steps.testers.outputs.testers }}"
          echo "::endgroup::"
