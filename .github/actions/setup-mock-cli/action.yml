name: 'Setup Mock CLI'
description: >
  Singleton: ensures the mock-cli-{platform}-{arch} binary is ready in
  bin/mock/{platform}/. Downloads the pre-built artifact from this workflow
  run when available; builds from source (and re-uploads for subsequent jobs)
  otherwise. Handles Linux, macOS, and Windows transparently.

inputs:
  platform:
    description: 'Target platform: linux | mac | windows'
    default: 'linux'
  arch:
    description: 'Target CPU architecture: x64 | arm64'
    default: 'x64'

runs:
  using: composite
  steps:
    # ── Fast path: artifact already exists in this workflow run ───────────────
    # Check via API first to avoid a spurious error annotation from
    # download-artifact when the artifact simply hasn't been uploaded yet.
    - name: Check if artifact exists in this run
      id: check-artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        artifact_name="mock-cli-${{ inputs.platform }}-${{ inputs.arch }}"
        found=$(gh api \
          "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" 2>/dev/null || true)
        if [ -n "$found" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Try downloading pre-built artifact
      id: download
      if: steps.check-artifact.outputs.found == 'true'
      uses: actions/download-artifact@v8
      with:
        name: mock-cli-${{ inputs.platform }}-${{ inputs.arch }}
        path: bin/mock/${{ inputs.platform }}

    # ── Slow path: build from source (only when download failed) ─────────────
    - name: Setup pnpm
      if: steps.check-artifact.outputs.found == 'false'
      uses: pnpm/action-setup@v6
      with:
        version: 9

    - name: Setup Node.js
      if: steps.check-artifact.outputs.found == 'false'
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: 'pnpm'

    - name: Install Dependencies
      if: steps.check-artifact.outputs.found == 'false'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Bun
      if: steps.check-artifact.outputs.found == 'false'
      uses: oven-sh/setup-bun@v2

    - name: Build from source (Unix)
      if: steps.check-artifact.outputs.found == 'false' && inputs.platform != 'windows'
      shell: bash
      run: bash cli/mock/build-mock-cli-${{ inputs.platform }}.sh ${{ inputs.arch }}

    - name: Build from source (Windows)
      if: steps.check-artifact.outputs.found == 'false' && inputs.platform == 'windows'
      shell: cmd
      run: cli\mock\build-mock-cli-windows.bat

    # Upload so subsequent jobs in the same run skip the build entirely
    - name: Upload artifact for subsequent jobs (Unix)
      if: steps.check-artifact.outputs.found == 'false' && inputs.platform != 'windows'
      uses: actions/upload-artifact@v7
      with:
        name: mock-cli-${{ inputs.platform }}-${{ inputs.arch }}
        path: bin/mock/${{ inputs.platform }}/mockCli-${{ inputs.platform }}-${{ inputs.arch }}
        retention-days: 1
        if-no-files-found: error
        overwrite: true

    - name: Upload artifact for subsequent jobs (Windows)
      if: steps.check-artifact.outputs.found == 'false' && inputs.platform == 'windows'
      uses: actions/upload-artifact@v7
      with:
        name: mock-cli-${{ inputs.platform }}-${{ inputs.arch }}
        path: bin/mock/${{ inputs.platform }}/mockCli-${{ inputs.platform }}-${{ inputs.arch }}.exe
        retention-days: 1
        if-no-files-found: error
        overwrite: true

    # ── chmod only on Unix (Windows binaries don't need it) ───────────────────
    - name: Make executable
      if: inputs.platform != 'windows'
      shell: bash
      run: chmod +x bin/mock/${{ inputs.platform }}/mockCli-${{ inputs.platform }}-${{ inputs.arch }}
