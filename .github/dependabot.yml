version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    auto-merge: true
    groups:
      actions-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch

  # npm packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    auto-merge: true
    ignore:
      # Ignore major version bumps for runtime-critical packages
      - dependency-name: '@actions/*'
        update-types:
          - version-update:semver-major
    groups:
      actions-sdk-minor:
        applies-to: version-updates
        patterns:
          - '@actions/*'
        update-types:
          - minor
          - patch
      dev-dependencies-minor:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      security-all:
        applies-to: security-updates
        update-types:
          - minor
          - patch
          - major
